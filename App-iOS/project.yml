# Lathe for iPhone and iPad — a sideload build.
#
# Not for the App Store, and not pretending to be: it links LatheFetch, which
# is the downloader, and that is the one product an App Store build would
# leave out. It exists so the same queue and the same browser are reachable
# from the device the links are usually shared from.
#
#   Sources/LatheFetch/fetch-upstream.sh   # CPython, once, from the repo root
#   xcodegen generate --spec App-iOS/project.yml
#   xcodebuild -project App-iOS/Lathe.xcodeproj -scheme Lathe \
#     -destination 'generic/platform=iOS' build
#
# WHY A SECOND PROJECT RATHER THAN A TARGET IN App/
#
# App/Package.swift is macOS-only and links the embedded Tor framework, whose
# slices are Mac slices. Adding an iOS target there would mean making that
# manifest conditional on a platform it cannot build for. This project depends
# on the root package instead — which has declared .iOS(.v17) all along — and
# simply has no embedded Tor, which is the same position as a contributor who
# has not run slim-tor.sh: routing falls back to an external proxy.
name: Lathe
options:
  bundleIdPrefix: com.lathe
  createIntermediateGroups: true
  deploymentTarget:
    iOS: "26.0"

packages:
  Lathe:
    path: ..

targets:
  # NOT "Lathe": the root package already vends a scheme by that name, and
  # `-scheme Lathe` resolves to the library, builds it happily, and leaves you
  # with BUILD SUCCEEDED and no .app anywhere. The product is still called
  # Lathe; only the target and scheme are disambiguated.
  LatheiOS:
    type: application
    platform: iOS
    sources:
      - path: ../App/Sources/LatheApp
        excludes:
          # Mac mechanisms with no iOS counterpart, each referenced only from
          # code that is itself fenced to macOS.
          - AppDelegate.swift      # NSApplicationDelegate, Dock/menu-bar modes
          - LoginSelfTest.swift    # asks macOS about login items
          - Presence.swift         # menu-bar item vs Dock icon
          - ShortcutExport.swift   # writes and signs a .shortcut for the Mac
      # The same layered Icon Composer document the Mac app compiles (see
      # App/make-app.sh). actool turns it into Assets.car plus CFBundleIcons;
      # the system derives the dark, tinted and clear appearances from it.
      # Without it the home screen shows the blank placeholder.
      - path: ../App/Icon/Lathe.icon
        buildPhase: resources
    dependencies:
      - package: Lathe
        product: LatheCore
      - package: Lathe
        product: LatheImage
      - package: Lathe
        product: LatheVideo
      - package: Lathe
        product: LatheAudio
      - package: Lathe
        product: LatheDoc
      - package: Lathe
        product: LatheMeta
      - package: Lathe
        product: LatheFetch
      # CPython, for LatheFetch's downloaders. LatheFetch binds it at run time
      # through dlsym, so the app must link it (the symbols are then in the
      # process) and embed it. Fetched, never committed:
      #   Sources/LatheFetch/fetch-upstream.sh   (from the repository root)
      # See Sources/LatheFetch/VENDORING.md.
      - framework: ../.python-apple-support/Python.xcframework
        embed: true
        codeSign: true
    postCompileScripts:
      # The standard library and the lib-dynload extension modules, which the
      # framework dependency above cannot deliver. Upstream's install_python;
      # see embed-python.sh. Runs before Embed Frameworks, as upstream's
      # testbed does, and on every build — it copies from outside the project.
      - name: Install Python standard library
        script: '"$PROJECT_DIR/embed-python.sh"'
        basedOnDependencyAnalysis: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.lathe.app
        PRODUCT_NAME: Lathe
        CURRENT_PROJECT_VERSION: "1"
        MARKETING_VERSION: "1.1.2"
        GENERATE_INFOPLIST_FILE: YES
        # Names the .icon document above, which is how Xcode finds an icon
        # that is not an AppIcon set inside an .xcassets.
        ASSETCATALOG_COMPILER_APPICON_NAME: Lathe
        INFOPLIST_KEY_CFBundleDisplayName: Lathe
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: >-
          UIInterfaceOrientationPortrait
          UIInterfaceOrientationLandscapeLeft
          UIInterfaceOrientationLandscapeRight
        # The inbox is a folder in iCloud Drive; the app reads what a Shortcut
        # drops there, and the Files app is how anyone gets at what it saved.
        # These two keys live in Info.plist (merged with the generated one)
        # because UIFileSharingEnabled has no INFOPLIST_KEY_ build setting:
        # set that way it was silently dropped, and without it iOS never lists
        # the app under Files › On My iPhone, so downloads were unreachable.
        INFOPLIST_FILE: Info.plist
        SWIFT_VERSION: "6.0"
        # embed-python.sh reads the xcframework from outside the project
        # and writes ~2,900 files and ~70 frameworks into the bundle.
        ENABLE_USER_SCRIPT_SANDBOXING: NO
        TARGETED_DEVICE_FAMILY: "1,2"
