name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # Keep SwiftPM's scratch directory off any synced or network-backed path.
  # Codesigning a test bundle fails with "resource fork, Finder information, or
  # similar detritus not allowed" when extended attributes come along for the
  # ride.
  SCRATCH_PATH: ${{ github.workspace }}/.ci-build

jobs:
  macos:
    name: macOS (Swift ${{ matrix.swift }})
    # Pin the image. `macos-latest` moves under you and takes the Xcode default
    # with it. Never `macos-14` (Intel, slower, older toolchain) and never a
    # `-large` runner (billed, and no faster for a package this size).
    runs-on: macos-15
    strategy:
      fail-fast: false
      matrix:
        swift: ["6.0"]

    steps:
      - uses: actions/checkout@v4

      # Deliberately NOT pinning a specific Xcode.app. Pinning one that the
      # runner image happens to ship without a matching iOS runtime produces
      # "Unable to find a destination" with an EMPTY available list — which
      # reads like a scheme problem and is not one.
      - name: Report toolchain
        run: |
          xcode-select -p
          xcodebuild -version
          swift --version

      - name: Report toolchain
        run: |
          swift --version
          xcodebuild -version

      - name: Cache SwiftPM
        uses: actions/cache@v4
        with:
          path: |
            ${{ env.SCRATCH_PATH }}
            ~/.cache/org.swift.swiftpm
          key: spm-macos-${{ matrix.swift }}-${{ hashFiles('Package.swift', 'Package.resolved') }}
          restore-keys: |
            spm-macos-${{ matrix.swift }}-

      - name: Build
        run: swift build --scratch-path "$SCRATCH_PATH" -v

      - name: Test
        run: swift test --scratch-path "$SCRATCH_PATH"

  ios-simulator:
    name: iOS Simulator
    runs-on: macos-15

    steps:
      - uses: actions/checkout@v4

      # Deliberately NOT pinning a specific Xcode.app. Pinning one that the
      # runner image happens to ship without a matching iOS runtime produces
      # "Unable to find a destination" with an EMPTY available list — which
      # reads like a scheme problem and is not one.
      - name: Report toolchain
        run: |
          xcode-select -p
          xcodebuild -version
          swift --version

      - name: Cache SwiftPM
        uses: actions/cache@v4
        with:
          path: ~/.cache/org.swift.swiftpm
          key: spm-ios-${{ hashFiles('Package.swift', 'Package.resolved') }}
          restore-keys: |
            spm-ios-

      - name: Resolve the test scheme
        id: scheme
        run: |
          set -euo pipefail
          # Always print the raw list: when this fails, the scheme names are
          # the first thing anyone needs and the only place they appear.
          xcodebuild -list -json | tee /tmp/schemes.json
          SCHEME=$(python3 - <<'PY'
          import json
          d = json.load(open("/tmp/schemes.json"))
          info = d.get("workspace") or d.get("project") or {}
          schemes = info.get("schemes", [])
          pick = next((s for s in schemes if s.endswith("-Package")), None) \
              or next((s for s in schemes if s == info.get("name")), None) \
              or (schemes[0] if schemes else "")
          print(pick)
          PY
          )
          if [ -z "$SCHEME" ]; then
            echo "::error::No schemes found. See the JSON above."
            exit 1
          fi
          echo "scheme=$SCHEME" >> "$GITHUB_OUTPUT"

      # Ask xcodebuild itself which destinations it will accept, rather than
      # asking simctl which simulators exist. Those are different questions:
      # simctl happily lists a device whose runtime the selected Xcode cannot
      # use, and handing that UDID to xcodebuild fails with an empty
      # "Available destinations" list that looks like a scheme error.
      - name: Resolve a usable simulator destination
        id: sim
        run: |
          set -euo pipefail
          xcodebuild -scheme "${{ steps.scheme.outputs.scheme }}" -showdestinations 2>&1 \
            | tee /tmp/destinations.txt || true

          # Two traps in this output, both verified against real xcodebuild:
          #   1. Real device lines carry "arch:arm64, " between the platform and
          #      the id, so a pattern expecting id: immediately after platform:
          #      matches nothing.
          #   2. The FIRST iOS Simulator line is a placeholder
          #      (id:dvtdevice-...:placeholder, "Any iOS Simulator Device"),
          #      which xcodebuild will not run tests on.
          # Hence: drop placeholders, then take a real 36-character UUID.
          # iPhone is preferred only so the run is predictable; any simulator works.
          # Note the explicit branch rather than a conditionally-expanded pipe:
          # ${1:+| grep ...} expands to a LITERAL "|" argument, not a pipeline
          # operator, so the filter silently does nothing.
          pick_udid() {
            if [ -n "${1:-}" ]; then
              grep 'platform:iOS Simulator' /tmp/destinations.txt \
                | grep -v 'placeholder' | grep "name:.*$1" \
                | grep -oE 'id:[0-9A-Fa-f-]{36}' | head -1 | sed 's/^id://'
            else
              grep 'platform:iOS Simulator' /tmp/destinations.txt \
                | grep -v 'placeholder' \
                | grep -oE 'id:[0-9A-Fa-f-]{36}' | head -1 | sed 's/^id://'
            fi
          }
          UDID=$(pick_udid iPhone)
          [ -n "$UDID" ] || UDID=$(pick_udid)

          if [ -z "$UDID" ]; then
            echo "::error::No usable iOS Simulator destination for this scheme."
            echo "Installed runtimes, for comparison with the destinations above:"
            xcrun simctl list runtimes || true
            exit 1
          fi
          echo "Using simulator $UDID"
          echo "udid=$UDID" >> "$GITHUB_OUTPUT"

      - name: Build and test on the simulator
        run: |
          set -euo pipefail
          # xcbeautify ships on the current runner images, but pretty-printing
          # is not worth failing a build over if an image bump drops it.
          FORMATTER="cat"
          if command -v xcbeautify >/dev/null 2>&1; then FORMATTER="xcbeautify"; fi
          xcodebuild test \
            -scheme "${{ steps.scheme.outputs.scheme }}" \
            -destination "platform=iOS Simulator,id=${{ steps.sim.outputs.udid }}" \
            -resultBundlePath "$SCRATCH_PATH/ios-results.xcresult" \
            CODE_SIGNING_ALLOWED=NO \
            | $FORMATTER || exit "${PIPESTATUS[0]}"

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ios-simulator-results
          path: TestResults.xcresult
          if-no-files-found: ignore
          retention-days: 7

  lint:
    name: Format check
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      # Advisory only. A formatter disagreement should not block a codec fix.
      - name: swift-format
        continue-on-error: true
        run: swift format lint --recursive --strict Sources Tests TestSupport
