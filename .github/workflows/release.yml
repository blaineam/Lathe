name: Release

# Cuts a macOS release from a `v*` tag: runs the tests, builds the app bundle,
# signs and notarizes it when the credentials are configured, and attaches a
# DMG to a GitHub Release.
#
# ## Signing is optional on purpose
#
# Every signing step is guarded on the secrets being present, and the workflow
# produces a working release either way — signed and notarized if it can,
# plainly labelled as unsigned if it cannot. A workflow that goes red because
# an optional secret is missing teaches everyone to ignore it, and a release
# pipeline nobody reads is worse than no pipeline.
#
# ## A tag with no app is not a failure
#
# This is a library first. Tagging `v1.2.0` to publish a SwiftPM version is
# normal and expected, and the app is a second product that happens to live in
# the same repository. If the app cannot be built the library release still
# succeeds.

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to build (defaults to the current ref)'
        required: false

permissions:
  contents: write

# One release at a time, and never cancel one.
#
# Releases piled up during a run of quick successive tags: every one claimed a
# macOS runner, and they competed with each other for capacity that is scarce
# to begin with. Queued rather than cancelled, because unlike CI a release run
# is not superseded by the next push — each tag is its own artifact, and
# throwing one away loses a build somebody may be waiting on.
concurrency:
  group: release
  cancel-in-progress: false

env:
  APP_NAME: Lathe
  # Keep SwiftPM's scratch directory off any synced or network-backed path:
  # codesigning fails with "resource fork, Finder information, or similar
  # detritus not allowed" when extended attributes come along for the ride.
  SCRATCH_PATH: ${{ github.workspace }}/.release-build

jobs:
  test:
    name: Tests
    runs-on: macos-26
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
      # Deliberately NOT pinning a specific Xcode.app — the same rule ci.yml
      # already records, which this workflow contradicted. The runner image's
      # Xcode path changes between image versions, and
      # `/Applications/Xcode_26.app` does not exist on macos-26-arm64: every
      # release run failed in eighteen seconds with "invalid developer
      # directory", which reads like a toolchain problem with the project and
      # is not one.
      - name: Report toolchain
        run: |
          xcode-select -p
          xcodebuild -version
          swift --version

      # LAME's dynamic framework. While Package.swift points the `LAME` binary
      # target at a local path, nothing in this package resolves until the zip
      # exists — not even products that never touch MP3. Once the target is a
      # release URL, SwiftPM downloads it and this step has nothing to do.
      # See Vendor/LAME/VENDORING.md.

      - name: Run the suite
        run: |
          # Serially, and that is not a preference.
          #
          # Swift Testing runs suites in parallel by default. LatheFetch
          # bootstraps ONE embedded CPython for the whole process — Py_Initialize
          # happens once per process, so it must be shared — and a shared
          # interpreter under the GIL, reached from several suites at once, is a
          # deadlock waiting for the right machine. It found one here: every
          # suite announced itself, and then the job sat in silence until the
          # runner killed it.
          #
          # Serial execution also makes the log usable. In parallel, "started"
          # lines from thirty suites interleave and the last one printed is not
          # the one that hung; run in order, the final line names it.
          swift test --scratch-path "$SCRATCH_PATH" --no-parallel

  app:
    name: Mac app
    needs: test
    runs-on: macos-26
    timeout-minutes: 45
    outputs:
      artifact: ${{ steps.package.outputs.artifact }}
      signed: ${{ steps.sign.outputs.signed }}
    steps:
      - uses: actions/checkout@v5

      # Deliberately NOT pinning a specific Xcode.app — the same rule ci.yml
      # already records, which this workflow contradicted. The runner image's
      # Xcode path changes between image versions, and
      # `/Applications/Xcode_26.app` does not exist on macos-26-arm64: every
      # release run failed in eighteen seconds with "invalid developer
      # directory", which reads like a toolchain problem with the project and
      # is not one.
      - name: Report toolchain
        run: |
          xcode-select -p
          xcodebuild -version
          swift --version

      # LAME's dynamic framework. The app does not link it, but it depends on
      # this package by path, and while Package.swift points the `LAME` binary
      # target at a local path the package does not resolve until the zip
      # exists. Once the target is a release URL this step has nothing to do.
      # See Vendor/LAME/VENDORING.md.

      - name: Build the bundle
        run: |
          # The same script a contributor runs. There is deliberately no
          # .xcodeproj: the whole repository builds with `swift build`, and a
          # project file would be a second source of truth to keep in step.
          ./App/make-app.sh "${GITHUB_REF_NAME#v}"
          test -d "App/build/$APP_NAME.app" || { echo "::error::The bundle was not produced."; exit 1; }

      - name: Verify the icon actually compiled
        run: |
          # actool reports failures in its partial plist rather than in its exit
          # status, so a broken icon ships silently as no icon at all. The build
          # script checks this too; checking again here means a release never
          # goes out with a blank tile in the Dock.
          test -f "App/build/$APP_NAME.app/Contents/Resources/Assets.car" \
            || { echo "::error::No compiled asset catalog — the icon did not build."; exit 1; }
          /usr/libexec/PlistBuddy -c "Print :CFBundleIconName" \
            "App/build/$APP_NAME.app/Contents/Info.plist" \
            || { echo "::error::CFBundleIconName is missing; macOS would show a generic icon."; exit 1; }

      - name: Are signing credentials configured?
        id: creds
        env:
          CERTIFICATE_P12: ${{ secrets.DEVELOPER_ID_CERTIFICATE_P12 }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
        run: |
          if [ -n "$CERTIFICATE_P12" ] && [ -n "$APPLE_ID" ]; then
            echo "available=yes" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::No Developer ID secrets configured — shipping an unsigned build. See DISTRIBUTION.md."
            echo "available=no" >> "$GITHUB_OUTPUT"
          fi

      - name: Import signing certificate
        if: steps.creds.outputs.available == 'yes'
        env:
          CERTIFICATE_P12: ${{ secrets.DEVELOPER_ID_CERTIFICATE_P12 }}
          CERTIFICATE_PASSWORD: ${{ secrets.DEVELOPER_ID_CERTIFICATE_PASSWORD }}
        run: |
          CERT_PATH=$RUNNER_TEMP/certificate.p12
          KEYCHAIN_PATH=$RUNNER_TEMP/build.keychain-db
          KEYCHAIN_PASSWORD=$(openssl rand -base64 32)

          echo "$CERTIFICATE_P12" | base64 --decode > "$CERT_PATH"

          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security import "$CERT_PATH" -P "$CERTIFICATE_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN_PATH"
          security set-key-partition-list -S apple-tool:,apple: -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security list-keychains -d user -s "$KEYCHAIN_PATH" login.keychain-db
          rm -f "$CERT_PATH"

      - name: Sign
        id: sign
        if: steps.creds.outputs.available == 'yes'
        run: |
          IDENTITY=$(security find-identity -v -p codesigning "$RUNNER_TEMP/build.keychain-db" \
            | grep "Developer ID Application" | head -1 | sed 's/.*"\(.*\)".*/\1/')
          if [ -z "$IDENTITY" ]; then
            echo "::error::No 'Developer ID Application' identity in the imported certificate."
            exit 1
          fi
          # Masked: the identity string contains the Team ID, and this is a
          # public repository whose build logs anyone can read.
          echo "::add-mask::$IDENTITY"

          # Hardened runtime, because notarization requires it. The entitlement
          # is what lets the bundled CPython map its own pages; without it the
          # interpreter cannot start under the hardened runtime and every
          # extractor silently becomes unavailable.
          codesign --force --deep --timestamp --options runtime \
            --entitlements App/Lathe.entitlements \
            --sign "$IDENTITY" "App/build/$APP_NAME.app"

          codesign --verify --deep --strict --verbose=2 "App/build/$APP_NAME.app"
          codesign -dvv "App/build/$APP_NAME.app" 2>&1 | grep -q "flags=.*runtime" \
            || { echo "::error::Hardened runtime is not enabled; notarization will reject this."; exit 1; }
          echo "identity=$IDENTITY" >> "$GITHUB_OUTPUT"
          echo "signed=yes" >> "$GITHUB_OUTPUT"

      # Notarize and staple the APP before it goes into the disk image.
      #
      # Notarizing only the DMG staples the ticket to the DMG. That looks
      # complete — `stapler validate` passes on the DMG and Gatekeeper accepts
      # it — but the ticket does not travel with the app when someone drags it
      # to Applications. From then on the app has nothing stapled to it, so its
      # first launch needs Apple's servers to confirm the notarization, and on
      # a machine that is offline or behind a filtering proxy it is refused.
      #
      # notarytool will not take a bare .app, so it goes up as a zip; the
      # ticket is then stapled to the app itself, which is what ships.
      - name: Notarize the app
        if: steps.creds.outputs.available == 'yes' && steps.sign.outputs.signed == 'yes'
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
        run: |
          ditto -c -k --keepParent "App/build/$APP_NAME.app" "$RUNNER_TEMP/$APP_NAME.zip"
          Scripts/notarize.sh "$RUNNER_TEMP/$APP_NAME.zip" "App/build/$APP_NAME.app"

      - name: Package DMG
        id: package
        run: |
          mkdir -p dist
          Scripts/build-dmg.sh "App/build/$APP_NAME.app" "dist/$APP_NAME.dmg" \
            "${{ steps.sign.outputs.identity }}"
          echo "artifact=dist/$APP_NAME.dmg" >> "$GITHUB_OUTPUT"

      # And the disk image as well, so the download itself opens cleanly.
      - name: Notarize the disk image
        if: steps.creds.outputs.available == 'yes'
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
        run: Scripts/notarize.sh "dist/$APP_NAME.dmg"

      # Checked from inside the finished image, because that is the copy a
      # user ends up running. A release whose app carries no ticket fails here
      # rather than on somebody's offline laptop.
      - name: Verify what ships
        if: steps.creds.outputs.available == 'yes'
        run: |
          MNT="$RUNNER_TEMP/verify"
          hdiutil attach "dist/$APP_NAME.dmg" -nobrowse -readonly -mountpoint "$MNT"
          trap 'hdiutil detach "$MNT" -quiet || true' EXIT
          xcrun stapler validate "$MNT/$APP_NAME.app"
          spctl -a -vvv -t install "$MNT/$APP_NAME.app"
          xcrun stapler validate "dist/$APP_NAME.dmg"

      - name: Checksum
        run: shasum -a 256 "dist/$APP_NAME.dmg" | tee dist/SHA256SUMS

      - uses: actions/upload-artifact@v4
        with:
          name: macos-app
          path: dist/

  # The iOS app, as a sideload.
  #
  # Unsigned on purpose: this is not an App Store build — it links the
  # downloader, which is the one product an App Store build leaves out — and
  # a certificate belonging to this repository would be no use to whoever
  # installs it. The tools people sideload with re-sign it with their own
  # Apple ID, which is what makes the thing installable at all.
  #
  # Allowed to fail without taking the Mac release with it. The DMG is what
  # most people came for, and a broken iOS build is not a reason to publish
  # nothing.
  ios:
    name: iOS app
    runs-on: macos-26
    timeout-minutes: 45
    continue-on-error: true
    steps:
      - uses: actions/checkout@v5

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate the project
        run: xcodegen generate --spec App-iOS/project.yml

      - name: Build
        run: |
          xcodebuild -project App-iOS/Lathe.xcodeproj -scheme LatheiOS \
            -destination 'generic/platform=iOS' -configuration Release \
            -derivedDataPath build-ios CODE_SIGNING_ALLOWED=NO build

      - name: Package
        run: |
          # `xcodebuild` reports success for a scheme that built a library and
          # no application, which is exactly what happens when the scheme name
          # collides with the package's. Check for the bundle, not the status.
          APP=$(find build-ios/Build/Products -maxdepth 2 -name 'Lathe.app' | head -1)
          [ -n "$APP" ] || { echo "::error::built, but no Lathe.app was produced"; exit 1; }
          mkdir -p Payload dist-ios
          cp -R "$APP" Payload/
          zip -qry "dist-ios/Lathe-iOS.ipa" Payload
          shasum -a 256 dist-ios/Lathe-iOS.ipa | tee dist-ios/SHA256SUMS-iOS

      - uses: actions/upload-artifact@v4
        with:
          name: ios-app
          path: dist-ios/

  publish:
    name: Publish
    needs: [app, ios]
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v4
        with:
          name: macos-app
          path: dist
      - uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: ios-app
          path: dist

      - name: Release notes
        id: notes
        run: |
          {
            echo 'body<<LATHE_EOF'
            echo "## Lathe ${GITHUB_REF_NAME}"
            echo
            echo '### Swift package'
            echo
            echo '```swift'
            echo ".package(url: \"https://github.com/${GITHUB_REPOSITORY}.git\", from: \"${GITHUB_REF_NAME#v}\")"
            echo '```'
            echo
            echo '### Mac app'
            echo
            if [ "${{ needs.app.outputs.signed }}" = "yes" ]; then
              echo 'Download `Lathe.dmg`, open it, and drag the app to Applications.'
              echo 'Signed and notarized by Apple, so there is no Gatekeeper warning.'
            else
              echo 'Download `Lathe.dmg`, open it, and drag the app to Applications.'
              echo
              echo '**This build is not signed.** The first launch needs right-click → Open;'
              echo 'after that it opens normally. Verify it against `SHA256SUMS` below.'
            fi
            echo
            echo 'Requires macOS 26.'
            echo
            echo '### iPhone and iPad'
            echo
            echo '`Lathe-iOS.ipa` is a sideload, not an App Store build — it links'
            echo 'the downloader, which is the one thing an App Store build leaves out.'
            echo 'It is **unsigned**: install it with a sideloading tool that signs with'
            echo 'your own Apple ID, or sign it yourself. Requires iOS 26.'
            echo 'LATHE_EOF'
          } >> "$GITHUB_OUTPUT"

      - uses: softprops/action-gh-release@v2
        with:
          name: Lathe ${{ github.ref_name }}
          body: ${{ steps.notes.outputs.body }}
          files: |
            dist/Lathe.dmg
            dist/SHA256SUMS
            dist/Lathe-iOS.ipa
            dist/SHA256SUMS-iOS
          draft: false
          prerelease: ${{ contains(github.ref_name, '-rc') || contains(github.ref_name, '-beta') }}
