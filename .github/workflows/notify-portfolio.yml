# Triggers the portfolio's `mirror-app-docs` workflow the moment the
# site changes, instead of waiting for its scheduled run. The default
# GITHUB_TOKEN cannot dispatch to another repository, so this needs a
# token with access to the portfolio, stored as PORTFOLIO_DISPATCH_TOKEN.
# Without it the step is skipped and the scheduled mirror catches up.

name: Notify portfolio to mirror docs

on:
  push:
    branches: [main]
    paths:
      - 'docs/**'
  workflow_dispatch:

jobs:
  dispatch:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger mirror-app-docs in portfolio
        env:
          GH_TOKEN: ${{ secrets.PORTFOLIO_DISPATCH_TOKEN }}
        run: |
          if [ -z "$GH_TOKEN" ]; then
            echo "::notice::PORTFOLIO_DISPATCH_TOKEN is not set; the portfolio's scheduled mirror will pick this up."
            exit 0
          fi
          gh api -X POST \
            /repos/blaineam/blaineam.github.io/dispatches \
            -f event_type=mirror-app-docs
